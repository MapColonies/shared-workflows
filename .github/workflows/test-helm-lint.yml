name: Helm Lint repository

on:
  pull_request:
    paths:
      - "actions/helm-lint/**"
      - "test/helm/**"
      
permissions:
  contents: write
  id-token: write

jobs:
  test-helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The action lints only charts changed vs the base branch.
      - name: Touch test chart so list-changed picks it up
        run: |
          echo "# touched by CI" >> test/helm/values.yaml
          git -c user.name=ci -c user.email=ci@example.com commit -qam "test: touch chart"

      - name: helm lint
        uses: ./actions/helm-lint
        id: helm-lint
        with:
          chartPaths: "test"
          registry: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_PUSH_USER }}
          password: ${{ secrets.ACR_PUSH_TOKEN }}

      - name: Print on chart change
        if: steps.helm-lint.outputs.changed == 'true'
        run: echo "Charts were changed."
