name: test-validate-domain

on:
  pull_request:
    paths:
    - "actions/validate-domain/**"
    - "test/validate-domain/**"
  
jobs:
  validate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test validate domain action
        uses: ./actions/validate-domain
        with:
          chart-file: test/helm/Chart.yaml

      - name: Test multiple charts via glob
        uses: ./actions/validate-domain
        with:
          chart-file: test/helm/Chart.yaml test/validate-domain/valid-*/Chart.yaml

      - name: Test invalid domain fails
        id: invalid
        continue-on-error: true
        uses: ./actions/validate-domain
        with:
          chart-file: test/validate-domain/*/Chart.yaml

      - name: Assert invalid domain failed
        if: steps.invalid.outcome != 'failure'
        run: exit 1

      - name: Test unmatched glob fails
        id: unmatched
        continue-on-error: true
        uses: ./actions/validate-domain
        with:
          chart-file: test/does-not-exist/*/Chart.yaml

      - name: Assert unmatched glob failed
        if: steps.unmatched.outcome != 'failure'
        run: exit 1

      - name: Test recursive glob
        uses: ./actions/validate-domain
        with:
          chart-file: test/validate-domain/**/valid-*/Chart.yaml

      - name: Test empty chart-file fails
        id: empty
        continue-on-error: true
        uses: ./actions/validate-domain
        with:
          chart-file: " "

      - name: Assert empty chart-file failed
        if: steps.empty.outcome != 'failure'
        run: exit 1
