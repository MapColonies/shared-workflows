name: pull_request

on:
  workflow_call:
    inputs:
      pathFilters:
        description: >-
          dorny/paths-filter filters (YAML) gating jobs on changed files. Keys: lint, openapi, helm, deps (security),
          tests, docker. A missing key, or an empty value, runs that job on every PR.
        type: string
        required: false
        default: ""
      skipReleasePleasePrs:
        description: "Skip all jobs on release-please PRs (head branch release-please--*)"
        type: boolean
        required: false
        default: true
      enableOpenApiCheck:
        description: "Flag to enable OpenAPI lint checks"
        type: boolean
        required: false
        default: true
      openApiFilePath:
        description: "Path to the OpenAPI file (if enableOpenApiCheck is true)"
        type: string
        required: false
        default: "./openapi3.yaml"
      usePostgres:
        description: "Flag to set up postgres database for tests"
        type: boolean
        required: false
        default: false
      enableHelmLint:
        description: "Flag to enable helm lint"
        type: boolean
        required: false
        default: true

jobs:
  changes:
    # Every job needs this one, so skipping it on a release-please PR skips them all.
    if: ${{ !(inputs.skipReleasePleasePrs && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      openapi: ${{ steps.filter.outputs.openapi }}
      helm: ${{ steps.filter.outputs.helm }}
      deps: ${{ steps.filter.outputs.deps }}
      tests: ${{ steps.filter.outputs.tests }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out Git repository
        if: ${{ inputs.pathFilters != '' }}
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        if: ${{ inputs.pathFilters != '' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ inputs.pathFilters }}
          # Empty token makes the action diff with git instead of the PR files API,
          # so callers don't have to grant pull-requests: read.
          token: ""

  helm-lint:
    needs: changes
    if: ${{ inputs.enableHelmLint == true && needs.changes.outputs.helm != 'false' }}
    uses: MapColonies/shared-workflows/.github/workflows/helm-lint.yaml@v5
    secrets: inherit

  eslint:
    name: Run eslint
    needs: changes
    if: ${{ needs.changes.outputs.lint != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint
        
  openapi-lint:
    name: Run openapi-lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ inputs.enableOpenApiCheck == true && needs.changes.outputs.openapi != 'false' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint
        
      - name: OpenAPI Lint Checks
        run: npx @redocly/cli lint --format=github-actions ${{ inputs.openApiFilePath }}

  security:
    needs: changes
    if: ${{ needs.changes.outputs.deps != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tests:
    name: Run Tests
    needs: changes
    if: ${{ needs.changes.outputs.tests != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: ${{ (inputs.usePostgres == true) && 'postgis/postgis:13-3.4' || ''}}
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - uses: actions/upload-artifact@v4
        with:
          name: Test Reporters Node-${{ matrix.node }}
          path: reports/**

  build_image:
    name: Build Image
    needs: changes
    if: ${{ needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: build Docker image
        run: docker build -t test-build:latest .
