name: Update artifacts.json

on:
  pull_request:
    paths:
      - "actions/update-artifacts-file/**"
      - ".github/workflows/test-update-artifacts-file.yml"

jobs:
  update-artifacts-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update artifacts.json
        uses: ./actions/update-artifacts-file
        with:
          type: "helm"
          domain: infra
          artifact_name: "jenkins"
          artifact_tag: "5.0.17"
          registry: ${{ secrets.ACR_URL }}
          github_token: ${{ secrets.GH_PAT }}
          target_repo: "MapColonies/helm-charts-new"
          target_branch: "ci/update-artifacts-file-test"
