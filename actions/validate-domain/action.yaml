name: validate-domain
description: "Validate that Chart.yaml files contain annotations.domain with an allowed value"

inputs:
  chart-file:
    description: "Path to Chart.yaml, or several whitespace-separated paths/globs (e.g. charts/*/Chart.yaml)"
    required: false
    default: "helm/Chart.yaml"

runs:
  using: composite
  steps:
    - name: Validate domain
      env:
        ALLOWED_DOMAINS: "raster,vector,infra,3d,app,dem,common"
        CHART_FILES: ${{ inputs.chart-file }}
      shell: bash
      run: |
        shopt -s globstar
        failed=0
        count=0
        # Unquoted on purpose so globs expand; a glob matching nothing stays literal and fails the -f check.
        for chart in $CHART_FILES; do
          count=$((count + 1))
          [ -f "$chart" ] || { echo "::error::No such Chart.yaml: $chart"; failed=1; continue; }
          domain=$(yq e '.annotations.domain' "$chart") || { failed=1; continue; }
          if [ "$domain" = null ]; then
            echo "::error file=$chart::Missing annotations.domain"
            failed=1
          elif ! tr ',' '\n' <<< "$ALLOWED_DOMAINS" | grep -qx "$domain"; then
            echo "::error file=$chart::Invalid domain: $domain"
            failed=1
          fi
        done
        [ "$count" -gt 0 ] || { echo "::error::chart-file is empty: no Chart.yaml to validate"; exit 1; }
        exit $failed
