---
# brackets, comments and trailing-spaces warn: most consumer charts violate them today.
rules:
  braces:
    level: error
  brackets:
    level: warning
  colons:
    level: error
  commas:
    level: error
  comments:
    level: warning
  document-end: disable
  document-start: disable           # No --- to start a file
  hyphens:
    level: warning
  indentation:
    level: warning
  key-duplicates: enable
  line-length: disable              # Lines can be any length
  new-line-at-end-of-file: enable
  new-lines:
    type: unix
  trailing-spaces:
    level: warning
  truthy:
    level: warning
