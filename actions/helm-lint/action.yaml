name: "Lint and Test Helm Charts"
description: "An action to lint and test Helm charts using chart-testing and kind."
inputs:
  chartPaths:
    description: "Comma-separated list of root directories containing Helm charts."
    required: false
    default: "."
  registry:
    description: "OCI registry to log in to before building chart dependencies. Lint and install run only when registry, username and password are all set."
    required: false
    default: ""
  username:
    description: "Registry username."
    required: false
    default: ""
  password:
    description: "Registry password."
    required: false
    default: ""
  install:
    description: "Also install the changed charts in a kind cluster."
    required: false
    default: "false"
outputs:
  changed: 
    description: "Indicates if there are changed charts."
    value: ${{ steps.list-changed.outputs.changed }}
runs:
  using: "composite"
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        check-latest: true

    - name: Set up chart-testing
      uses: helm/chart-testing-action@v2

    - name: Run chart-testing (list-changed)
      id: list-changed
      run: |
        changed=$(ct list-changed --config "${{ github.action_path }}/ct.yaml" --chart-dirs "${{ inputs.chartPaths }}" --target-branch "${{ github.base_ref || github.event.repository.default_branch }}")
        if [[ -n "$changed" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Log in to the registry
      id: login
      if: steps.list-changed.outputs.changed == 'true' && inputs.registry != '' && inputs.username != '' && inputs.password != ''
      env:
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
      run: printf '%s' "$PASSWORD" | helm registry login "$REGISTRY" --username "$USERNAME" --password-stdin
      shell: bash

    - name: Warn that lint is skipped
      if: steps.list-changed.outputs.changed == 'true' && steps.login.outcome == 'skipped'
      run: echo "::warning::Charts changed but were not linted. Pass registry, username and password to lint them."
      shell: bash

    - name: Run chart-testing (lint)
      if: steps.login.outcome == 'success'
      run: ct lint --config "${{ github.action_path }}/ct.yaml" --lint-conf "${{ github.action_path }}/lintconf.yaml" --chart-dirs "${{ inputs.chartPaths }}" --target-branch "${{ github.base_ref || github.event.repository.default_branch }}"
      shell: bash

    - name: Create kind cluster
      if: inputs.install == 'true' && steps.login.outcome == 'success'
      uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0

    - name: Run chart-testing (install)
      if: inputs.install == 'true' && steps.login.outcome == 'success'
      run: ct install --config "${{ github.action_path }}/ct.yaml" --chart-dirs "${{ inputs.chartPaths }}" --target-branch "${{ github.base_ref || github.event.repository.default_branch }}"
      shell: bash
